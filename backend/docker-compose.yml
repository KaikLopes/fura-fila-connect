    networks:
      - furafila_network

  # ── Dashboard Service ───────────────────────────────────────────────────
  dashboard-service:
    build:
      context: .
      dockerfile: services/Dockerfile.service
    container_name: furafila_dashboard
    environment:
      - SERVICE_NAME=dashboard-service
      - DASHBOARD_SERVICE_PORT=3005
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  # ── Configurações Service ───────────────────────────────────────────────
  configuracoes-service:
    build:
      context: .
      dockerfile: services/Dockerfile.service
    container_name: furafila_configuracoes
    environment:
      - SERVICE_NAME=configuracoes-service
      - CONFIGURACOES_SERVICE_PORT=3006
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
