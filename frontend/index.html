<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FuraFila Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="icon" type="image/png" href="./assets/img/kaikfoto.png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <i class="fa-solid fa-staff-snake"></i>
        <h1>FuraFila<span> Connect</span></h1>
        <p>Acesse sua conta para gerenciar a clínica</p>
      </div>

      <div class="auth-error" id="authError">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="authErrorText"></span>
      </div>

      <div class="auth-success" id="authSuccess" style="display: none;">
        <i class="fa-solid fa-check-circle"></i>
        <span id="authSuccessText"></span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <div style="position: relative;">
            <input type="password" id="senha" class="form-input" placeholder="••••••••" required style="padding-right: 40px;">
            <button type="button" onclick="togglePassword('senha', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748b; cursor: pointer; padding: 4px;">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnLogin" style="margin-top: 8px;">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
      </form>

      <div class="auth-footer">
        <a href="esqueci-senha.html" class="forgot-password">
          <i class="fa-solid fa-key"></i> Esqueci minha senha
        </a>
        <br><br>
        <!-- Não tem uma conta? <a href="registrar.html">Cadastre-se</a> -->
      </div>

      <div style="display: flex; align-items: center; margin: 25px 0; width: 100%;">
      <div style="flex-grow: 1; height: 1px; background-color: #e5e7eb;"></div>
      <span style="padding: 0 15px; color: #9ca3af; font-size: 14px; font-weight: 500;">OU</span>
      <div style="flex-grow: 1; height: 1px; background-color: #e5e7eb;"></div>
      </div> 

      <button type="button" id="btnRecrutador" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; border: 2px solid #e5e7eb; background-color: #f9fafb; color: #374151; font-weight: 600; cursor: pointer; transition: all 0.2s ease;" onmouseover="this.style.borderColor='#2563eb'; this.style.backgroundColor='#fff';" onmouseout="this.style.borderColor='#e5e7eb'; this.style.backgroundColor='#f9fafb';">
        <i class="fa-solid fa-briefcase" style="color: #2563eb;"></i>
          Entrar como Visitante (Recrutador)
      </button>

      <p style="text-align: center; font-size: 12px; color: #9ca3af; margin-top: 10px; line-height: 1.5;">
        Acesso rápido com dados fictícios para <br> avaliação de portfólio.
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
