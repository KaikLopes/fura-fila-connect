      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  configuracoes-service:
    build:
      context: ./services/configuracoes-service
      dockerfile: Dockerfile
    container_name: furafila_configuracoes
    environment:
      - PORT=3006
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

volumes:
  postgres_data:
    driver: local

networks:
  furafila_network:
    driver: bridge
