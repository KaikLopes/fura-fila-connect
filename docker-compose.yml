version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: furafila_postgres
    environment:
      POSTGRES_DB: furafila_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furafila_network

  redis:
    image: redis:7-alpine
    container_name: furafila_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furafila_network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: furafila_gateway
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - AGENDA_SERVICE_URL=http://agenda-service:3002
      - PROFISSIONAIS_SERVICE_URL=http://profissionais-service:3003
      - CLIENTES_SERVICE_URL=http://clientes-service:3004
      - DASHBOARD_SERVICE_URL=http://dashboard-service:3005
      - CONFIGURACOES_SERVICE_URL=http://configuracoes-service:3006
      - FRONTEND_URL=http://localhost:5500
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: furafila_auth
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  agenda-service:
    build:
      context: ./services/agenda-service
      dockerfile: Dockerfile
    container_name: furafila_agenda
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  profissionais-service:
    build:
      context: ./services/profissionais-service
      dockerfile: Dockerfile
    container_name: furafila_profissionais
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  clientes-service:
    build:
      context: ./services/clientes-service
      dockerfile: Dockerfile
    container_name: furafila_clientes
    environment:
      - PORT=3004
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - furafila_network

  dashboard-service:
    build:
      context: ./services/dashboard-service
      dockerfile: Dockerfile
    container_name: furafila_dashboard
    environment:
      - PORT=3005
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=furafila_connect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - GATEWAY_URL=http://api-gateway:3000
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
